# Alembic configuration file
# This file is used by alembic when run from backend/

[alembic]
# Path to migration scripts relative to this file
script_location = alembic

# Template used to generate migration script filenames
file_template = %%(rev)s_%%(slug)s

# SQLite database — relative to this ini file (backend/), resolves to backend/meeting.db
sqlalchemy.url = sqlite:///meeting.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
